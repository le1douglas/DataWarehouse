# every value is an environment variable, from x-dbt-env in docker/compose.yaml
data_build_tool:
  # one target for every environment: each environment has its own connection
  target: dw
  outputs:
    dw:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      port: "{{ env_var('DBT_PORT') | as_number }}"
      dbname: "{{ env_var('DBT_DBNAME') }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_ENV_SECRET_PASSWORD') }}"
      schema: dw # the prefix of every schema dbt creates, such as dw_silver
      threads: 1
