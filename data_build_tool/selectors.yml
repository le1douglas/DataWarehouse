# setup: every relation of the project, run by the setup scripts on a new database and after a seed or model changes
# - one dbt process, so each schema is created once, before any node runs
# - no load is open, so silver and gold are created empty and the datasets can load in any order
selectors:
  - name: setup
    description: elementary's tables, the seeds and every model, without the data tests of a load
    definition:
      union:
        # elementary's tables: its on-run-end hook writes to them after every build
        - method: package
          value: elementary
        # cautious: a test is selected only when every model it reads is selected
        - method: resource_type
          value: seed
          indirect_selection: cautious
        - method: path
          value: models
          indirect_selection: cautious
        # without staging's data tests: they judge a load, and on an empty staging the row counts would fail and skip
        # silver and gold. gold's key tests stay: they pass on empty tables
        - exclude:
            - intersection:
                - method: resource_type
                  value: test
                - method: path
                  value: models/staging
