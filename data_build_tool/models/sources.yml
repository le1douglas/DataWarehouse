
sources:
  - name: dw_bronze
    description: The main source of data. The store of all raw data, exactly as received from the sources, one table per source.
                It has meaning on its own. Everything is stored as text and almost nothing is asserted about it.
    tables:
      # no data tests here: a load is judged in staging (stg_<dataset>.yml)
      - name: brnz_journal_entries
        description: csv of drip and drain measurements, one row per spot.
      - name: brnz_plants_batches
        description: csv of plants batches, one row per plants batch, each with its planned timeline.

  - name: dw_control
    description: The state of the loads, written only by Airflow (postgres/01_create_schemas_and_tables.sql).
    tables:
      - name: ctl_loads
        description: The current state of every load, one row per load, updated in place by Airflow. See
                    macros/loads_in_state.sql.
