# the readers of gold outside dbt, one exposure each (docs/DEV_CONTAINER.md, section 3)
# - dbt ls --select +exposure:<name> lists what a reader relies on
# - a reader that starts reading a model adds it here
exposures:
  - name: excel_journal_entries_daily
    label: Excel daily sheet of the journal entries
    type: analysis
    description: >-
      The growers' daily sheet in Excel, read from the warehouse database: one row per room per day, with the drip and
      the drain of each side. It reads the columns of fct_journal_entries__daily by name, so renaming, dropping or
      retyping one of them breaks the sheet.
    owner:
      name: dw
    depends_on:
      - ref('fct_journal_entries__daily')
