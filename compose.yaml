services:
  postgres:
    image: postgres:18
    command: postgres -c timezone=Europe/Amsterdam -c log_timezone=Europe/Amsterdam #all timestamp without timezone are assumed to be amsterdam. so we set it as a delfault here as well.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./Database/01_create_schemas_and_tables.sql:/docker-entrypoint-initdb.d/01_create_schemas_and_tables.sql:ro
    restart: unless-stopped

  # a job: "docker compose run --rm dbt <command>" runs one dbt command, then the container exits
  dbt:
    build:
      context: . # the repo root. docker/dbt/Dockerfile.dockerignore keeps only DataWarehouseDbt
      dockerfile: docker/dbt/Dockerfile
      target: runtime # the stage without any tools. compose.dev.yaml builds dev instead
    image: dbt:${RELEASE}
    env_file: .env.transformer
    depends_on:
      - postgres
    profiles: ["job"] # not started by "up", only by "run"

  # a job: "docker compose run --rm loader bronze" (or corrections) runs one load, then the container exits
  loader:
    build:
      context: . # the repo root. docker/loader/Dockerfile.dockerignore keeps only src
      dockerfile: docker/loader/Dockerfile
      target: runtime # the stage without any tools. compose.dev.yaml builds dev instead
    image: loader:${RELEASE}
    env_file: .env.loader
    volumes:
      # the inputs, read only (:ro), so the loader can never change an export or the workbook
      - ${EXPORTS_DIR:?set EXPORTS_DIR in the env file}:/inbox/exports:ro
      - ${CORRECTIONS_DIR:?set CORRECTIONS_DIR in the env file}:/inbox/corrections:ro
    depends_on:
      - postgres
    profiles: ["job"] # not started by "up", only by "run"

volumes:
  pgdata:
