default_environment: dw
project_id: 01a1a092-fb86-7349-a6ae-ffc686e2b184
environments:
- name: dw
send_anonymous_usage_stats: false
plugins:
  extractors:
  # the base every dataset inherits, never run itself
  # - one run gives every file under files the same load_id, so each dataset is a child with one file
  - name: tap-csv
    variant: meltanolabs
    # not on pypi: pinned to a git tag
    pip_url: git+https://github.com/MeltanoLabs/tap-csv.git@v1.3.2
    config:
      # every row gets the load's load_id, which the caller sets in MELTANO_RUN_ID
      # - without it the insert fails on bronze's NOT NULL load_id
      # - "*" matches every stream, so a new dataset needs nothing here
      stream_maps:
        "*":
          load_id: config['load_id']
      stream_map_config:
        load_id: ${MELTANO_RUN_ID}
    # a stream map declares load_id as a plain string, and target-postgres would fail altering bronze's uuid column
    schema:
      "*":
        load_id:
          type: string
          format: uuid
    # how every csv is read. tap-csv takes these only per file, so each child's file merges them in
    # - meltano does not pass this key to the tap
    default_csv_dialect: &default_csv_dialect
      delimiter: ','
      keys: []
      encoding: utf-8-sig # a BOM at the start is stripped
      quotechar: '"'
      doublequote: true # a quote inside a quoted value is written twice: "a ""quoted"" word"
      escapechar: null # no escape character: a backslash is an ordinary character
      skipinitialspace: false # a space after the delimiter belongs to the value
      strict: true # quoting errors fail the read. a row with more or fewer fields than the header still passes

  # one child per dataset
  # - entity is the table in dw_bronze
  # - USER_INPUT_MOUNT is the input folder, mounted read only (docker/compose.yaml)
  - name: tap-csv-journal-entries
    inherit_from: tap-csv
    config:
      files:
      - entity: brnz_journal_entries
        path: ${USER_INPUT_MOUNT}/journal_entries/journal_entries.csv
        <<: *default_csv_dialect


  - name: tap-csv-plants-batches
    inherit_from: tap-csv
    config:
      files:
      - entity: brnz_plants_batches
        path: ${USER_INPUT_MOUNT}/plants_batches/plants_batches.csv
        <<: *default_csv_dialect

  loaders:
  - name: target-postgres
    variant: meltanolabs
    pip_url: meltanolabs-target-postgres==0.8.1
    # the connection is TARGET_POSTGRES_* in docker/compose.yaml
    config:
      default_target_schema: dw_bronze
      load_method: append-only
      add_record_metadata: false
      activate_version: false
