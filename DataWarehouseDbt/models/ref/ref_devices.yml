models:
  - name: ref_devices
    description: >-
      The measuring devices, cast from seed_devices. Staging and silver test against it, dim_devices publishes it.
      Change a device in seed_devices.csv.
    columns:
      - name: device
        data_tests:
          - elementary.expect_column_values_to_be_unique_with_context:
              config:
                meta:
                  description: device must be unique
          - elementary.not_null_with_context:
              config:
                meta:
                  description: device is missing
      - name: manufacturer
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: manufacturer is missing
      - name: is_working
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: is_working is missing
