models:
  - name: dim_relative_positions
    description: >-
      Where on the bench a journal entry was measured: one row per combination of a depth, a horizontal and a vertical
      value. Published from ref_relative_positions: add or change a value in seed_relative_position_values.csv, not here.
    # a table that only publishes ref_relative_positions: its contract checks names and types, its primary key is
    # here, the other data tests are in ref_relative_positions.yml. see docs/CODING_STANDARDS.md
    columns:
      - name: relative_position
        data_type: text
        description: "The key: depth, horizontal and vertical joined by _, such as front_left_up."
        data_tests:
          # the primary key: dbt_constraints adds it after the test passes (dbt_project.yml)
          - dbt_constraints.primary_key
      - name: depth
        data_type: text
        description: front or back.
      - name: horizontal
        data_type: text
        description: left or right.
      - name: vertical
        data_type: text
        description: up or down.
