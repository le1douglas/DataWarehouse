models:
  - name: fct_journal_entries
    description: The journal entries, one row per measurement, with a key to each dimension and the measures.
    columns:
      - name: row_id
        data_type: uuid
        description: The key, assigned by bronze when the journal entry was received.
      - name: date_time
        data_type: timestamptz(0)
        description: When the journal entry was measured.
      - name: device
        data_type: text
        description: The device that took the measurement.
        data_tests:
          - elementary.relationships_with_context:
              arguments:
                to: ref('dim_devices')
                field: device
              config:
                meta:
                  description: device is not in dim_devices
      - name: room
        data_type: text
        description: The room the measurement was taken in.
        data_tests:
          - elementary.relationships_with_context:
              arguments:
                to: ref('dim_rooms')
                field: room
              config:
                meta:
                  description: room is not in dim_rooms
      - name: bench
        data_type: integer
        description: The bench in the room the journal entry was measured at.
      - name: relative_position
        data_type: text
        description: Where on the bench it was measured, such as front_left_up.
        data_tests:
          - elementary.relationships_with_context:
              arguments:
                to: ref('dim_relative_positions')
                field: relative_position
              config:
                meta:
                  description: relative_position is not in dim_relative_positions
      - name: ml
        data_type: integer
        description: The volume.
      - name: ec
        data_type: numeric
      - name: ph
        data_type: numeric
      - name: temperature
        data_type: numeric
        description: The temperature.
