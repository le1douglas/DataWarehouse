models:
  - name: dim_sides
    description: The sides a journal entry can be measured on. Change a side in seed_sides.csv, not here.
    # a view, so it always equals the seed. a view has no constraints: its key is checked by data tests.
    # see docs/CODING_STANDARDS.md
    columns:
      - name: side
        data_type: varchar(50)
        description: left or right.
        data_tests:
          - elementary.expect_column_values_to_be_unique_with_context:
              config:
                meta:
                  description: side must be unique
          - elementary.not_null_with_context:
              config:
                meta:
                  description: side is missing
