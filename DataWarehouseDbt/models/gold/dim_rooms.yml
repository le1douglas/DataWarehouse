models:
  - name: dim_rooms
    description: The growing rooms. Change a room in seed_rooms.csv, not here.
    # a view that only publishes ref_rooms: its contract checks names and types, the data tests are in ref_rooms.yml.
    # see docs/CODING_STANDARDS.md
    columns:
      - name: room
        data_type: text
        description: The room, as text so 1.30 keeps its zero.
      - name: room_time
        data_type: text
        description: The part of the day the room is measured in.
      - name: floor_number
        data_type: integer
      - name: assigned_stage
        data_type: text
      - name: benches_number
        data_type: integer
