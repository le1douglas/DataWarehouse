models:
  - name: dim_rooms
    description: The growing rooms. Change a room in seed_rooms.csv, not here.
    # a view, so it always equals the seed. a view has no constraints: its key and values are checked by data tests.
    # see docs/CODING_STANDARDS.md
    columns:
      - name: room
        data_type: varchar(50)
        description: The room, as text so 1.30 keeps its zero.
        data_tests:
          - elementary.expect_column_values_to_be_unique_with_context:
              config:
                meta:
                  description: room must be unique
          - elementary.not_null_with_context:
              config:
                meta:
                  description: room is missing
      - name: room_time
        data_type: varchar(50)
        description: The part of the day the room is measured in.
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: room_time is missing
          - elementary.expression_is_true_with_context:
              arguments:
                expression: "in ('morning', 'afternoon', 'all_day')"
              config:
                meta:
                  description: room_time is not morning, afternoon or all_day
      - name: floor_number
        data_type: integer
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: floor_number is missing
      - name: assigned_stage
        data_type: varchar(50)
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: assigned_stage is missing
      - name: benches_number
        data_type: integer
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: benches_number is missing
