models:
  - name: dim_rooms
    description: The growing rooms. Change a room in seed_rooms.csv, not here.
    # a table that only publishes ref_rooms: its contract checks names and types, its primary key is here, the other
    # data tests are in ref_rooms.yml. see docs/CODING_STANDARDS.md
    columns:
      - name: room
        data_type: text
        description: The room, as text so 1.30 keeps its zero.
        data_tests:
          # the primary key: dbt_constraints adds it after the test passes (dbt_project.yml)
          - dbt_constraints.primary_key:
              config:
                meta:
                  description: room is missing or not unique
      - name: room_time
        data_type: text
        description: The part of the day the room is measured in.
      - name: floor_number
        data_type: integer
      - name: assigned_stage
        data_type: text
      - name: benches_total
        data_type: integer
