models:
  - name: dim_devices
    description: The measuring devices. Change a device in seed_devices.csv, not here.
    config:
      # a table, not incremental, so it always equals the seed: incremental would keep a row that is removed from the seed.
      # no foreign key points here, a rebuild would drop it: silver checks devices with a relationship test.
      # see docs/CODING_STANDARDS.md
      contract:
        enforced: true
    columns:
      - name: device
        data_type: varchar(50)
        constraints:
          - type: primary_key
      - name: manufacturer
        data_type: varchar(50)
        constraints:
          - type: not_null
      - name: is_working
        data_type: boolean
        constraints:
          - type: not_null
