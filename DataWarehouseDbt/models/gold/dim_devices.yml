models:
  - name: dim_devices
    description: The measuring devices. Change a device in seed_devices.csv, not here.
    config:
      # a table, not incremental, so it always equals the seed: incremental would keep a row in table that is removed from the seed.
      # the price: the foreign key is is lost until the next successful build, so ther might me an unituitive error during this gap. see docs/CODING_STANDARDS.md for the reasoning.
      contract:
        enforced: true
    columns:
      - name: device
        data_type: varchar(50)
        constraints:
          - type: primary_key
      - name: manufacturer
        data_type: varchar(50)
        constraints:
          - type: not_null
      - name: is_working
        data_type: boolean
        constraints:
          - type: not_null
