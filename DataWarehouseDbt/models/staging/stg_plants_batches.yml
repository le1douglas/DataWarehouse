# only data tests: the columns and types and unique constraints are declared in slvr_plants_batches.yml.
# an uncastable value is null here, so not_null reports both. range, format and relationship tests ignore nulls, so a
# bad value gives one error. the description of a data test is the message the user sees.
models:
  - name: stg_plants_batches
    data_tests:
      # the key is unique_key in slvr_plants_batches.yml: pp_number
      - unique_within_upload:
          arguments:
            dataset: plants_batches
          config:
            meta:
              description: this pp_number appears more than once in the file
      # a warning, not a refusal: a newer upload of a plants batch overrides the older one in silver, and this lists it
      - unique_across_accepted_uploads:
          arguments:
            dataset: plants_batches
          config:
            severity: warn
            meta:
              description: this plants batch replaces the one of an earlier upload
      # two plants batches cannot share a room at the same time. the dates are estimates, so only the exact same
      # flowering dates count: overlapping ones are not checked. a clash with silver is caught only by its constraint
      - elementary.expect_compound_columns_to_be_unique_with_context:
          arguments:
            column_list: [room, date_flower_start, date_flower_end]
          config:
            meta:
              description: another plants batch has this room and these flowering dates
      - elementary.expect_column_pair_values_A_to_be_greater_than_B_with_context:
          arguments:
            column_A: date_flower_start
            column_B: date_veg_start
          config:
            meta:
              description: date_flower_start must be later than date_veg_start
      - elementary.expect_column_pair_values_A_to_be_greater_than_B_with_context:
          arguments:
            column_A: date_flower_end
            column_B: date_flower_start
          config:
            meta:
              description: date_flower_end must be later than date_flower_start
      - elementary.expression_is_true_with_context:
          arguments:
            expression: length(strain) <= 50
          config:
            meta:
              description: strain is longer than 50 characters
    columns:
      - name: row_id
        data_tests:
          - elementary.expect_column_values_to_be_unique_with_context:
              config:
                meta:
                  description: row_id must be unique
      - name: room
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: room is missing
          - relationships_where_with_context:
              arguments:
                to: ref('ref_rooms')
                field: room
                to_condition: "assigned_stage = 'flowering'"
              config:
                meta:
                  description: room is not a flowering room in seed_rooms
      - name: strain
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: strain is missing
      - name: pp_number
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: pp_number is missing
          - elementary.expect_column_values_to_match_regex_with_context:
              arguments:
                regex: "^PP-[0-9]{6}$"
              config:
                meta:
                  description: pp_number is not PP and six digits, such as PP000366 or PP-000366
      - name: date_veg_start
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: date_veg_start is missing or not a date as dd/mm/yyyy
      - name: date_flower_start
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: date_flower_start is missing or not a date as dd/mm/yyyy
      - name: date_flower_end
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: date_flower_end is missing or not a date as dd/mm/yyyy
      - name: plants_number
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: plants_number is missing or not a whole number
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 2000
              config:
                meta:
                  description: plants_number must be between 1 and 2000
