# only data tests: the columns and types are declared in slvr_journal_entries.yml. the names repeat on purpose: a data test
# reports every bad row with a message, a constraint of silver is the last guard.
# an uncastable value is null here, so not_null reports both. range and relationship tests ignore nulls, so a bad value
# gives one error. the description of a data test is the message the user sees.
models:
  - name: stg_journal_entries
    data_tests:
      - elementary.expect_compound_columns_to_be_unique_with_context:
          arguments:
            column_list: [date_time, device]
          config:
            meta:
              description: this device already has a measurement at this moment
    columns:
      - name: row_id
        data_tests:
          - elementary.expect_column_values_to_be_unique_with_context:
              config:
                meta:
                  description: row_id must be unique
      - name: date_time
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: date_time is missing or not a date and time
      - name: device
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: device is missing
          - elementary.relationships_with_context:
              arguments:
                to: ref('dim_devices')
                field: device
              config:
                meta:
                  description: device is not in dim_devices
      - name: spot
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: spot is missing
          - elementary.expect_column_values_to_match_regex_with_context:
              arguments:
                regex: "^(drip|drain)_(left|right)$"
              config:
                meta:
                  description: spot must be drip or drain, then left or right
      - name: ml
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: ml is missing or not a whole number
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 5000
              config:
                meta:
                  description: ml must be between 0 and 5000
      - name: ec
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: ec is missing or not a number
          - elementary.expression_is_true_with_context:
              arguments:
                expression: "= round(ec, 2)"
              config:
                meta:
                  description: ec has more than 2 decimals
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 10
              config:
                meta:
                  description: ec must be between 0 and 10
      - name: ph
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: ph is missing or not a number
          - elementary.expression_is_true_with_context:
              arguments:
                expression: "= round(ph, 2)"
              config:
                meta:
                  description: ph has more than 2 decimals
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 14
              config:
                meta:
                  description: ph must be between 0 and 14
      - name: temperature
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: temperature is missing or not a number
          - elementary.expression_is_true_with_context:
              arguments:
                expression: "= round(temperature, 2)"
              config:
                meta:
                  description: temperature has more than 2 decimals
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 50
              config:
                meta:
                  description: temperature must be between 0 and 50
      - name: room
        data_tests:
          - elementary.not_null_with_context:
              config:
                meta:
                  description: room is missing
          - elementary.relationships_with_context:
              arguments:
                to: ref('dim_rooms')
                field: room
              config:
                meta:
                  description: room is not in dim_rooms
