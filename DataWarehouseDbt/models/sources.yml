
sources:
  - name: dw_bronze
    description: The main source of data. The store of all raw data, exactly as received from the sources, one table per source.
                It has meaning on its own. Everything is stored as text and almost nothing is asserted about it.
    tables:
      - name: brnz_journal_entries
        description: csv of drip and drain measurements, one row per spot.
        data_tests:
          # nothing is checked before loading: a missing column arrives null and fails not_null in staging
          #test rows amount.

          #TODO add test for power of 10 and power of 2 rows, as they are common silent treshold.
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments:
                min_value: 20 # at least 5 rooms, 4 measurements per room
                max_value: 40 # at most 10 rooms, 4 measurements per room

                # one load only, the same as staging: the load_id var. a file without rows is 0 rows here
                # TODO check if it sbetter to test every load that has not been tested, according to aud
                row_condition: >-
                  load_id = '{{ var("load_id") }}'::uuid
              config:
                meta:
                  description: the file must have 20 to 40 rows
          
