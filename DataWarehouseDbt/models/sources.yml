
sources:
  - name: dw_bronze
    description: The main source of data. The store of all raw data, exactly as received from the sources, one table per source.
                It has meaning on its own. Everything is stored as text and almost nothing is asserted about it.
    tables:
      - name: brnz_journal_entries
        description: csv of drip and drain measurements, one row per spot.
        data_tests:
          # the presence of columns is checked before loading, and not_null in staging

          #test rows amount. TODO add test for power of 10 and power of 2 rows, as they are common silent treshold.
          - dbt_expectations.expect_table_row_count_to_be_between:
              arguments:
                min_value: 20 # at least 5 rooms, 4 measurements per room
                max_value: 40 # at most 10 rooms, 4 measurements per room

                # the latest load only: load_id is meltano's run_id, a uuidv7, so the highest one is the newest load.
                # postgres has no max() of a uuid, so the first in descending order
                # TODO check if load_time is more reliable than load_id
                row_condition: >-
                  load_id = (
                    select load_id
                    from {{ source("dw_bronze", "brnz_journal_entries") }}
                    order by load_id desc
                    limit 1
                  )
              config:
                meta:
                  description: the file must have 20 to 40 rows
          
