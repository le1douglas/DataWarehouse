
models:
  - name: meta_silver
    description: The meta table of silver, one row per journal entry with the date_time it was first published in silver.
                Shaped like meta_bronze and meta_corrections. A row is written once and never updated;
                dbt build --full-refresh drops the table and stamps every row with the time of that build.
    config:
      contract: {enforced: true}
    constraints:
      # the primary key has no name on purpose: its index is a relation, and a rebuild creates the new table next
      # to the old one, so a fixed name would already exist. postgres picks a free name instead
      - type: primary_key
        columns: [row_id, kind]
      # row_id is decided in bronze, so every meta table references bronze.
      # dropping the bronze table needs cascade because of this constraint
      - type: foreign_key
        name: fk_meta_silver_row_id
        columns: [row_id]
        to: source('dev_bronze', 'brnz_journal_entries')
        to_columns: [row_id]
    columns:
      - name: row_id
        data_type: uuid
        constraints:
          - type: not_null
      - name: kind
        data_type: varchar(50)
        constraints:
          - type: not_null
      - name: description
        data_type: varchar(400)
        constraints:
          - type: not_null
