# documentation, and the business key. the columns, their types and the data tests are declared in
# stg_journal_entries.yml. the types reach silver through select *, and dbt docs reads them from the database
models:
  - name: slvr_journal_entries
    description: The published journal entries, one row per measurement.
                A load is added only when staging passes every data test, and replaces the rows with the same
                date_time and device.
    config:
      # the business key, declared only here. what a load replaces (delete+insert), what the staging uniqueness tests
      # check, and silver's index (unique_key_index)
      unique_key: [date_time, device]
    columns:
      - name: date_time
        description: When the journal entry was measured, in the timezone var, to the microsecond as the csv sends it.
      - name: device
        description: The device that took the measurement.
      - name: absolute_position
        description: Where it was measured, room, bench and relative position joined by _, such as 1.30_4_front_left_up.
      - name: ml
        description: The amount of water.
      - name: ec
      - name: ph
      - name: temperature