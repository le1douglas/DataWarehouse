# setup: everything no load builds, in one dbt build run by the setup scripts (docker/02_setup_dev.ps1,
# docker/03_setup_prod.ps1), on a new database and again after a seed or one of these models changes. one dbt process
# creates each schema once, before any node runs
selectors:
  - name: setup
    description: elementary's tables, the seeds, the ref_ models and the dims over them
    definition:
      union:
        # elementary's own tables. its on-run-end hook writes to them, and runs after every node of the build
        - method: package
          value: elementary
        # cautious: a test is selected only when every model it reads is. staging's tests read ref_ models too, and
        # are left to the audit of a load
        - method: resource_type
          value: seed
          indirect_selection: cautious
        - method: path
          value: models/ref
          indirect_selection: cautious
        - method: path
          value: models/gold
          indirect_selection: cautious
        # without anything downstream of silver: silver takes the accepted load, so only a load's publish builds it
        # and what reads it. and without staging, which holds a load
        - exclude:
            - method: path
              value: models/silver
              children: true
            - method: path
              value: models/staging
