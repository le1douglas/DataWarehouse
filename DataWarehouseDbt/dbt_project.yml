name: 'DataWarehouseDbt'
version: '1.0.0'

# the profile in %USERPROFILE%\.dbt\profiles.yml, which has only a dev target
profile: 'DataWarehouseDbt'

vars:
  # assigned in silver to every timestamptz column, the datetimes have no time zone before it
  timezone: 'Europe/Amsterdam'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# the folder of a model decides its materialisation and schema
models:
  DataWarehouseDbt:
    staging:             # text except the key: mechanical changes plus auto-fix rules
      +materialized: view
      +schema: staging
    candidate:           # corrections override staging, then derived columns. still text
      +materialized: view
      +schema: candidate
    silver:              # casts and time zone, rebuilt only when all candidate tests pass
      +materialized: table
      +schema: silver

# every version of the rows of one table, see docs/CODING_STANDARDS.md. a snapshot mirrors its table exactly,
# so every one is configured the same: key in its own yml, every column compared, a deleted row is a version too
snapshots:
  DataWarehouseDbt:
    +schema: snapshots
    +strategy: check
    +check_cols: all
    +hard_deletes: new_record
    +snapshot_meta_column_names:
      dbt_valid_from: meta_valid_from
      dbt_valid_to: meta_valid_to
      dbt_scd_id: meta_version_id
      dbt_updated_at: meta_updated_at
      dbt_is_deleted: meta_is_deleted

# every data test fails the build, and its failing rows are stored in one table per data test
data_tests:
  DataWarehouseDbt:
    +severity: error
    +store_failures: true
    +schema: audit

# the audit view, one per dataset: every flagged row once, for the review in excel. see macros/create_audit_view.sql
on-run-end:
  - "{{ create_audit_view('journal_entries') }}"
