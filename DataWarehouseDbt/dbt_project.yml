name: 'DataWarehouseDbt'
version: '1.0.0'

# the profile in profiles.yml next to this file, which has one target, dw, for every environment and reads the connection from env vars
profile: 'DataWarehouseDbt'

vars:
  # appended in staging to a datetime whose source text has no time zone, so every datetime has one from staging on.
  # the container's time zone, set once in docker/compose.yaml. no default: without TZ dbt stops instead of guessing
  timezone: "{{ env_var('TZ') }}"
  # how many failing rows of a data test elementary stores. -1 is all of them, the default is 5
  test_sample_row_count: -1
  # gold's keys only: every primary, unique and foreign key of a gold model is a dbt_constraints test in its yml, so
  # a catalog and the tools reading gold see real keys. silver has none. at the end of a dbt build the package adds the constraint of each such test that ran and passed in that
  # build: a failed test fails the build, as every test does, and leaves its constraint missing. it releases the
  # constraints of a table it rebuilds before the build starts. on by default, set here so it shows
  dbt_constraints_enabled: true

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# where dbt deps installs the packages. dev sets the env var to the dbt-state volume (docker/compose.dev.yaml), as it
# sets DBT_TARGET_PATH and DBT_LOG_PATH, which dbt reads by itself. prod sets none of them: the folders next to this file
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"

# directories to be removed by `dbt clean`, wherever the env vars put them. in dev they are outside the project, so
# dbt clean needs --no-clean-project-files-only there
clean-targets:
  - "{{ env_var('DBT_TARGET_PATH', 'target') }}"
  - "{{ env_var('DBT_PACKAGES_INSTALL_PATH', 'dbt_packages') }}"

# the folder of a model decides its materialisation and schema
models:
  DataWarehouseDbt:
    staging:             # mapping and auto-fixes, then a generated safe cast
      +materialized: view
      +schema: bronze    # bronze tables are the raw data, bronze views are staging
      +contract:
        enforced: true    # every column declared with its type in the yml, the only place; silver takes them from here
    silver:              # no logic, rebuilt only when all staging tests pass
      # every silver model is incremental: staging holds only the latest load, which is added only when its tests
      # pass. a row of the load replaces the row with the same unique_key (in the model's yml), so a newer upload
      # overrides the older one. full_refresh is off: a rebuild from staging would keep only the latest load.
      # no contract: the types come from staging through select *, and on_schema_change fails the build when they change
      +materialized: incremental
      +incremental_strategy: delete+insert
      +on_schema_change: fail
      +full_refresh: false
      # no constraints: every rule is a data test on staging, and nothing writes to silver outside dbt build. one
      # plain index on unique_key, kept in step with it by unique_key_index, makes the delete of each load fast
      +post-hook:
        - "{{ unique_key_index() }}"
      +schema: silver
    ref:                 # the reference data: each seed cast, or combined, and tested. staging and silver test against it,
      +materialized: view  # gold publishes it. views, so they always equal the seeds; in silver, as trusted data
      +schema: silver
    gold:                # the modeled tables over silver and the seeds, rebuilt by every dbt build. tables, so they
      +materialized: table # hold their keys (dbt_constraints tests in each yml) and a catalog can draw the diagram
      +schema: gold
      +contract:
        enforced: true
    audit:               # what failed, read from elementary
      +materialized: view
      +schema: audit
  elementary:
    +schema: elementary

# reference data kept by hand in a csv, reloaded by every dbt build. a csv has no yml: dbt infers every type, except
# room, which is text in every seed (1.30 inferred as a number could become 1.3). its ref_ model holds its tests.
# a seed without a room column logs a warning that the override is ignored. after a type changes, run
# dbt seed --full-refresh once
seeds:
  DataWarehouseDbt:
    +schema: seeds
    +column_types: {room: text}

# every version of the rows of one table, see docs/CODING_STANDARDS.md. a snapshot mirrors its table exactly,
# so every one is configured the same: key in its own yml, every column compared, a deleted row is a version too
snapshots:
  DataWarehouseDbt:
    +schema: snapshots
    +strategy: check
    +check_cols: all
    +hard_deletes: new_record
    +snapshot_meta_column_names:
      dbt_valid_from: meta_valid_from
      dbt_valid_to: meta_valid_to
      dbt_scd_id: meta_version_id
      dbt_updated_at: meta_updated_at
      dbt_is_deleted: meta_is_deleted

# every data test fails the build. elementary stores its failing rows, see macros/materialization_test.sql
data_tests:
  DataWarehouseDbt:
    +severity: error
