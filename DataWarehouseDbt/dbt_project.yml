
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'DataWarehouseDbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'DataWarehouseDbt'

vars:
  timezone: 'Europe/Amsterdam'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  DataWarehouseDbt:
    staging:             # text except the key: mechanical changes plus auto-fix rules
      +materialized: view
      +schema: staging
    candidate:           # corrections override staging, then guarded casts and derived columns
      +materialized: view
      +schema: candidate
    silver:              # typed and derived columns, rebuilt only when all candidate tests pass
      +materialized: table
      +schema: silver

# failing rows are stored in one table per data test. after every run, create_audit_views puts the failure tables
# of each candidate model in one view, aud_<token>, with one row per flagged row and the failed data tests in
# meta_failed_tests. a data test that does not return whole candidate rows is left out of the view, with a warning
data_tests:
  DataWarehouseDbt:
    +store_failures: true
    +schema: audit

on-run-end:
  - "{{ create_audit_views() }}"