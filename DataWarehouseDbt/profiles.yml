# connection for dbt. every value comes from an environment variable, set by compose: host and port from the
# environment's transformer env file, database, user and password from its project env file (see compose.yaml)
DataWarehouseDbt:
  # one target for every environment: the environment comes from the connection, set per environment by compose
  target: dw
  outputs:
    dw:
      type: postgres
      host: "{{ env_var('DBT_HOST') }}"
      port: "{{ env_var('DBT_PORT') | as_number }}"
      dbname: "{{ env_var('DBT_DBNAME') }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_ENV_SECRET_PASSWORD') }}"
      schema: dw # dbt's default prefix: dw_staging, dw_candidate, dw_audit, dw_silver, dw_snapshots
      threads: 1
