seeds:
  - name: seed_rooms
    description: The growing rooms, kept by hand in seed_rooms.csv and reloaded by every dbt build. Published by dim_rooms.
    config:
      # every type is written, so dbt never infers one: 1.30 inferred as a number could become 1.3
      column_types:
        room: varchar(50)
        room_time: varchar(50)
        floor_number: integer
        assigned_stage: varchar(50)
        benches_number: integer
