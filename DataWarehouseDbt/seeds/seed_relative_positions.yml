seeds:
  - name: seed_relative_positions
    description: The relative positions a journal entry can be measured at, kept by hand in seed_relative_positions.csv and reloaded by every dbt build. Published by dim_relative_positions.
    config:
      # every type is written, so dbt never infers one
      column_types:
        relative_position: varchar(50)
        front_back: varchar(50)
        left_right: varchar(50)
        up_down: varchar(50)
