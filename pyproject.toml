[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datawarehouse"
version = "0.1.0"
description = "Bronze/Silver/Gold data warehouse pipeline"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pydantic",
    "SQLAlchemy",
    "pyodbc",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]