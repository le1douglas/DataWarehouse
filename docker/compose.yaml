# every container's time zone, written only here. a time sent without a zone is assumed to be in it
x-timezone: &timezone Europe/Amsterdam

# each mount path is written only here: the anchor is both the mount target and the env var the code reads
# - user input: USER_INPUT_DIR, the windows folder of every csv to load, read by meltano.yml
x-user-input-mount: &user_input_mount /user_input
# - user output: USER_OUTPUT_DIR, the windows folder of every file the programs write for the user
x-user-output-mount: &user_output_mount /user_output
# - work in progress: a volume, so a program's unfinished work survives run --rm, and dev and prod each have their own
x-work-in-progress-mount: &work_in_progress_mount /work_in_progress

# the connection to postgres, written only here
# - the port inside the docker network, not POSTGRES_PORT, which is published to windows and differs per environment
# - database, user and password come from the env file (.env or .env.prod)
# - every service connects as the postgres user until the roles exist
x-postgres-host: &postgres_host postgres
x-postgres-port: &postgres_port "5432"
x-postgres-db: &postgres_db ${POSTGRES_DB}
x-postgres-user: &postgres_user ${POSTGRES_USER}
x-postgres-password: &postgres_password ${POSTGRES_PASSWORD}

# the config every airflow component shares
x-airflow-env: &airflow_env
  TZ: *timezone
  # the time zone of the schedules and the web page
  AIRFLOW__CORE__DEFAULT_TIMEZONE: *timezone
  # tasks run in the scheduler container, one process each: no Celery, no Redis
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  # mounted from the repo in dev, copied into the image in prod
  AIRFLOW__CORE__DAGS_FOLDER: /usr/app/DataWarehouseAirflow/dags
  # where a running task reports its state
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  # the password is PGPASSWORD, not in the connection string, where an @ or / would break it
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}@postgres:5432/airflow
  PGPASSWORD: *postgres_password
  # the same in every component, or a task cannot report back. left empty, each component makes up its own
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in the env file}
  # no login: whoever opens the page is admin, so the port is published on localhost only (airflow-api-server)
  AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"

# dbt's connection (profiles.yml) and folders, for every airflow component that runs dbt or reads its manifest
# - the profile needs every connection value, even for a dbt parse, which does not connect
x-dbt-env: &dbt_env
  DBT_HOST: *postgres_host
  DBT_PORT: *postgres_port
  DBT_DBNAME: *postgres_db
  DBT_USER: *postgres_user
  DBT_ENV_SECRET_PASSWORD: *postgres_password
  # what dbt writes: one folder per release, so a rollback finds its own unchanged, and per role, so no dbt command
  # overwrites what another reads. the roles:
  # - airflow-manifest: the dags are drawn from it. written by airflow-init on every up and by refresh_metadata
  # - setup-build: the setup scripts' build
  # - interactive: any dbt command that names no target, such as yours or dbt Power User's
  # cosmos tasks write into their own temporary copy of the project (dbt_task_group.py)
  DBT_STATE_DIR: /dbt-state/${RELEASE}
  DBT_TARGET_PATH: /dbt-state/${RELEASE}/interactive/target
  DBT_LOG_PATH: /dbt-state/${RELEASE}/interactive/logs
  # outside the releases: it describes the database, which they share. written by refresh_metadata, read by
  # OpenMetadata and the diagram
  DBT_METADATA_EXPORT_DIR: /dbt-state/metadata-export

# what every airflow component shares. the logs are one volume, so the api server shows what the scheduler's tasks wrote
x-airflow: &airflow
  build:
    context: .. # the repo root. Dockerfile.dockerignore keeps only what the image needs
    dockerfile: docker/pipeline/Dockerfile
    target: runtime # dev builds it too, with the repo mounted on top (compose.dev.yaml)
  image: pipeline:${RELEASE}
  environment: *airflow_env
  volumes:
    - airflow-logs:/opt/airflow/logs
    # compose prefixes the volume with the project name, so dev and prod each have their own
    - dbt-state:/dbt-state
  depends_on:
    airflow-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    # change together with postgresql-client-<major> in docker/pipeline/Dockerfile
    image: postgres:18
    # - the server's time zone from TZ, so the zone stays written once. $$ leaves $TZ to sh, not compose
    # - datestyle YMD: the default MDY reads 03/11/2026 as 11 March. YMD refuses it instead of guessing
    command: ["sh", "-c", "exec docker-entrypoint.sh postgres -c timezone=\"$$TZ\" -c log_timezone=\"$$TZ\" -c datestyle=\"ISO, YMD\""]
    environment:
      TZ: *timezone
      POSTGRES_DB: *postgres_db
      POSTGRES_USER: *postgres_user
      POSTGRES_PASSWORD: *postgres_password
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ../Database/00_create_airflow_database.sql:/docker-entrypoint-initdb.d/00_create_airflow_database.sql:ro
      - ../Database/00_create_meltano_database.sql:/docker-entrypoint-initdb.d/00_create_meltano_database.sql:ro
      - ../Database/01_create_schemas_and_tables.sql:/docker-entrypoint-initdb.d/01_create_schemas_and_tables.sql:ro
      # prod writes a dump here, dev restores it. ignored by git. a convenience for dev, not prod's backups
      - ../Database/dumps:/dumps
    # checked over tcp: on the first start the init scripts run on a server that listens only on its socket, so a
    # socket check would pass before the databases exist
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # airflow: one image, one container per component. airflow-init prepares the others and exits
  airflow-init:
    <<: *airflow
    environment:
      <<: [*airflow_env, *dbt_env]
    # - the publish pool, one slot (load_datasets.py). pools set creates or updates it
    # - dev's dbt packages, kept in the volume (compose.dev.yaml); prod has them in the image
    # - airflow's manifest, before the other components start, so no dag starts without it. it can change a running
    #   load's dag: never up during a load
    # - $$ leaves the variables to bash
    entrypoint: ["bash", "-c"]
    command:
      - >-
        airflow db migrate
        && airflow pools set publish 1 "one publish to silver and gold at a time"
        && { [ -z "$$DBT_PACKAGES_INSTALL_PATH" ] || dbt deps --log-path $$DBT_STATE_DIR/airflow-manifest/logs; }
        && dbt parse --target-path $$DBT_STATE_DIR/airflow-manifest/target --log-path $$DBT_STATE_DIR/airflow-manifest/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # the web page, the rest api, and the api the tasks report to
  airflow-api-server:
    <<: *airflow
    command: ["api-server"]
    # localhost only: anyone who reaches the port is admin (x-airflow-env)
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:?set AIRFLOW_PORT in the env file}:8080"

  # reads the dag files. cosmos draws the dbt tasks here, from airflow's manifest, so it needs dbt's env vars
  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    environment:
      <<: [*airflow_env, *dbt_env]

  # runs every task itself (LocalExecutor), so it is the only component that needs meltano and the input folder
  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    environment:
      <<: [*airflow_env, *dbt_env]
      # in postgres, not the default sqlite file. the password is PGPASSWORD (x-airflow-env)
      MELTANO_DATABASE_URI: postgresql+psycopg://${POSTGRES_USER}@postgres:5432/meltano
      TARGET_POSTGRES_HOST: *postgres_host
      TARGET_POSTGRES_PORT: *postgres_port
      TARGET_POSTGRES_DATABASE: *postgres_db
      TARGET_POSTGRES_USER: *postgres_user
      TARGET_POSTGRES_PASSWORD: *postgres_password
      USER_INPUT_MOUNT: *user_input_mount
    volumes:
      - airflow-logs:/opt/airflow/logs
      - dbt-state:/dbt-state
      # read only, so meltano never changes an export. long form: an anchor cannot go inside the short one's string
      - type: bind
        source: ${USER_INPUT_DIR:?set USER_INPUT_DIR in the env file}
        target: *user_input_mount
        read_only: true
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_started

  # interactive: takes the drip and drain readings of the OnePen until q, and writes a csv only
  # - started by src/bluelab_datastreamer/OnePen.cmd, with the windows bridge at host.docker.internal:8765
  datastreamer:
    build:
      context: .. # the repo root. Dockerfile.dockerignore keeps only src/bluelab_datastreamer
      dockerfile: docker/datastreamer/Dockerfile
      target: runtime # the only stage: dev builds it too, its tools are in the dev container
    image: datastreamer:${RELEASE}
    environment:
      TZ: *timezone # stamps each reading and names the daily csv
      USER_OUTPUT_MOUNT: *user_output_mount
      WORK_IN_PROGRESS_MOUNT: *work_in_progress_mount
    volumes:
      # long form: an anchor cannot go inside the short one's string
      - type: bind
        source: ${USER_OUTPUT_DIR:?set USER_OUTPUT_DIR in the env file}
        target: *user_output_mount
      - type: volume
        source: work-in-progress
        target: *work_in_progress_mount
    profiles: ["job"] # not started by "up", only by "run"

  # the NiceGUI pages of the warehouse
  webapps:
    build:
      context: .. # the repo root. Dockerfile.dockerignore keeps only src/webapps
      dockerfile: docker/webapps/Dockerfile
      target: runtime # the only stage: dev builds it too, its tools are in the dev container
    image: webapps:${RELEASE}
    environment:
      TZ: *timezone
      POSTGRESQL_SERVER: *postgres_host
      POSTGRESQL_PORT: *postgres_port
      POSTGRESQL_DB: *postgres_db
      POSTGRESQL_USER: *postgres_user
      POSTGRESQL_PASSWORD: *postgres_password
    # one port per environment, so dev and prod can run side by side
    ports:
      - "${NICEGUI_PORT:?set NICEGUI_PORT in the env file}:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
  work-in-progress:
  airflow-logs:
  dbt-state:
