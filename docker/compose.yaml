# the time zone of every container (its clock and date), written only here: a time without a zone is assumed to be amsterdam
x-timezone: &timezone Europe/Amsterdam

services:
  postgres:
    image: postgres:18
    # the server's time zone from TZ, so the zone stays written once. compose would replace $TZ itself, $$ leaves it to sh.
    # sh then runs the image's entrypoint with the expanded command, as a plain "command: postgres -c ..." would
    command: ["sh", "-c", "exec docker-entrypoint.sh postgres -c timezone=\"$$TZ\" -c log_timezone=\"$$TZ\""]
    environment:
      TZ: *timezone
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ../Database/01_create_schemas_and_tables.sql:/docker-entrypoint-initdb.d/01_create_schemas_and_tables.sql:ro
      # prod dumps for the dev refresh: prod writes a pg_dump here, dev restores it (read only, see compose.dev.yaml).
      # in the repo, ignored by git. a convenience for development, not the backups of prod
      - ../Database/dumps:/dumps
    restart: unless-stopped

  # a job: "docker compose run --rm dbt <command>" runs one dbt command, then the container exits
  dbt:
    build:
      context: .. # the repo root, one up from this folder. docker/dbt/Dockerfile.dockerignore keeps only DataWarehouseDbt
      dockerfile: docker/dbt/Dockerfile
      target: runtime # the stage without any tools. compose.dev.yaml builds dev instead
    image: dbt:${RELEASE}
    # the host is the service name above, and the port the one postgres listens on inside the docker network: not
    # POSTGRES_PORT, which is published to windows and changes per environment.
    # the database, user and password of postgres above, from the project env file (.env or .env.prod), so each is
    # written once per environment. until the roles exist every service is postgres
    environment:
      TZ: *timezone # dbt itself always logs in UTC, whatever this says
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_DBNAME: ${POSTGRES_DB}
      DBT_USER: ${POSTGRES_USER}
      DBT_ENV_SECRET_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    profiles: ["job"] # not started by "up", only by "run"

  # a job: "docker compose run --rm loader bronze" runs one load, then the container exits
  loader:
    build:
      context: .. # the repo root, one up from this folder. docker/loader/Dockerfile.dockerignore keeps only src
      dockerfile: docker/loader/Dockerfile
      target: runtime # the stage without any tools. compose.dev.yaml builds dev instead
    image: loader:${RELEASE}
    # the connection to postgres above, as for dbt
    environment:
      TZ: *timezone # CSVReader stamps meta_extract_date_time in it, read by src/datawarehouse/config.py
      POSTGRESQL_SERVER: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: ${POSTGRES_DB}
      POSTGRESQL_USER: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      # relative to /inbox/exports
      JOURNAL_ENTRIES_CSV: ${JOURNAL_ENTRIES_CSV:?set JOURNAL_ENTRIES_CSV in the env file}
    volumes:
      # the input, read only (:ro), so the loader can never change an export
      - ${EXPORTS_DIR:?set EXPORTS_DIR in the env file}:/inbox/exports:ro
    depends_on:
      - postgres
    profiles: ["job"] # not started by "up", only by "run"

  # interactive: "docker compose run --rm datastreamer" takes the drip and drain readings of the OnePen until q.
  # src/bluelab_datastreamer/OnePen.cmd starts it with the bridge (onepen_bridge.py) on windows, at host.docker.internal:8765.
  # no database and no env file: it writes a csv only
  datastreamer:
    build:
      context: .. # the repo root, one up from this folder. docker/datastreamer/Dockerfile.dockerignore keeps only src/bluelab_datastreamer
      dockerfile: docker/datastreamer/Dockerfile
      target: runtime # the stage without any tools. compose.dev.yaml builds dev instead
    image: datastreamer:${RELEASE}
    environment:
      TZ: *timezone # stamps each reading and names the daily csv, read by src/bluelab_datastreamer/drip_drain.py
    volumes:
      # where the csv of a part of the day is saved once every room is done
      - ${DAILY_RAW_CSV_DIR:?set DAILY_RAW_CSV_DIR in the env file}:/daily_raw_csv
    profiles: ["job"] # not started by "up", only by "run"

  # a server: the NiceGUI pages of the warehouse, at http://localhost on NICEGUI_PORT.
  # started by "up" with postgres, and kept running
  webapps:
    build:
      context: .. # the repo root, one up from this folder. docker/webapps/Dockerfile.dockerignore keeps only src/webapps
      dockerfile: docker/webapps/Dockerfile
      target: runtime # the stage without any tools. compose.dev.yaml builds dev instead
    image: webapps:${RELEASE}
    # the connection to postgres above, as for dbt
    environment:
      TZ: *timezone
      POSTGRESQL_SERVER: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: ${POSTGRES_DB}
      POSTGRESQL_USER: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
    # one port per environment, so dev and prod can run side by side (as postgres does)
    ports:
      - "${NICEGUI_PORT:?set NICEGUI_PORT in the env file}:8080"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
