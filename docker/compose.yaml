services:
  postgres:
    image: postgres:18
    command: postgres -c timezone=Europe/Amsterdam -c log_timezone=Europe/Amsterdam #all timestamp without timezone are assumed to be amsterdam. so we set it as a delfault here as well.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ../Database/01_create_schemas_and_tables.sql:/docker-entrypoint-initdb.d/01_create_schemas_and_tables.sql:ro
      # prod dumps for the dev refresh: prod writes a pg_dump here, dev restores it (read only, see compose.dev.yaml).
      # in the repo, ignored by git. a convenience for development, not the backups of prod
      - ../Database/dumps:/dumps
    restart: unless-stopped

  # a job: "docker compose run --rm dbt <command>" runs one dbt command, then the container exits
  dbt:
    build:
      context: .. # the repo root, one up from this folder. docker/dbt/Dockerfile.dockerignore keeps only DataWarehouseDbt
      dockerfile: docker/dbt/Dockerfile
      target: runtime # the stage without any tools. compose.dev.yaml builds dev instead
    image: dbt:${RELEASE}
    # no env_file here: each environment's overlay sets its own. compose appends an overlay's env_file to this one,
    # so a file here would leak dev's values into prod for any variable the prod file leaves out
    # the database, user and password of postgres above, from the project env file (.env or .env.prod), so each is
    # written once per environment. environment wins over env_file. until the roles exist every service is postgres
    environment:
      DBT_DBNAME: ${POSTGRES_DB}
      DBT_USER: ${POSTGRES_USER}
      DBT_ENV_SECRET_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - postgres
    profiles: ["job"] # not started by "up", only by "run"

  # a job: "docker compose run --rm loader bronze" (or corrections) runs one load, then the container exits
  loader:
    build:
      context: .. # the repo root, one up from this folder. docker/loader/Dockerfile.dockerignore keeps only src
      dockerfile: docker/loader/Dockerfile
      target: runtime # the stage without any tools. compose.dev.yaml builds dev instead
    image: loader:${RELEASE}
    # no env_file here: each environment's overlay sets its own (see dbt)
    # the database, user and password of postgres above, from the project env file (see dbt)
    environment:
      POSTGRESQL_DB: ${POSTGRES_DB}
      POSTGRESQL_USER: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # the inputs, read only (:ro), so the loader can never change an export or the workbook
      - ${EXPORTS_DIR:?set EXPORTS_DIR in the env file}:/inbox/exports:ro
      - ${CORRECTIONS_DIR:?set CORRECTIONS_DIR in the env file}:/inbox/corrections:ro
    depends_on:
      - postgres
    profiles: ["job"] # not started by "up", only by "run"

  # interactive: "docker compose run --rm datastreamer" takes the drip and drain readings of the OnePen until q.
  # src/bluelab_datastreamer/OnePen.cmd starts it with the bridge (onepen_bridge.py) on windows, at host.docker.internal:8765.
  # no database and no env file: it writes a csv only
  datastreamer:
    build:
      context: .. # the repo root, one up from this folder. docker/datastreamer/Dockerfile.dockerignore keeps only src/bluelab_datastreamer
      dockerfile: docker/datastreamer/Dockerfile
      target: runtime # the stage without any tools. compose.dev.yaml builds dev instead
    image: datastreamer:${RELEASE}
    volumes:
      # where the csv of a part of the day is saved once every room is done
      - ${DAILY_RAW_CSV_DIR:?set DAILY_RAW_CSV_DIR in the env file}:/daily_raw_csv
    profiles: ["job"] # not started by "up", only by "run"

volumes:
  pgdata:
