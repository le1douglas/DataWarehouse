# the time zone of every container (its clock and date), written only here: a time without a zone is assumed to be amsterdam
x-timezone: &timezone Europe/Amsterdam

# where USER_INPUT_DIR (the windows folder of every csv to load, from the env file) appears inside the meltano container,
# under the same name, written only here: the same anchor is the mount target and USER_INPUT_MOUNT, which
# DataWarehouseMeltano/meltano.yml reads. the file of each dataset is named in meltano.yml, not here
x-user-input-mount: &user_input_mount /user_input

# where USER_OUTPUT_DIR (the windows folder of every file the programs write for the user, from the env file) appears
# inside the datastreamer container, written only here: the same anchor is the mount target and USER_OUTPUT_MOUNT, which
# src/bluelab_datastreamer/drip_drain.py reads. each program names its own subfolder in its code, not here
x-user-output-mount: &user_output_mount /user_output

# where the work-in-progress volume appears inside the datastreamer container, written only here: the same anchor is the
# mount target and WORK_IN_PROGRESS_MOUNT, which src/bluelab_datastreamer/drip_drain.py reads. it holds what a program
# has not finished yet, such as the csv of the rooms done so far, so it survives the container (run --rm). each program
# names its own subfolder in its code. a volume, not a windows folder: compose prefixes it with the project name, so
# dev (dw-dev) and prod (dw-prod) each have their own
x-work-in-progress-mount: &work_in_progress_mount /work_in_progress

# the connection to postgres, written once here. the host is the service name below, and the port the one postgres listens
# on inside the docker network: not POSTGRES_PORT, which is published to windows and changes per environment.
# the database, user and password come from the project env file (.env or .env.prod), so each is written once per
# environment. until the roles exist every service is postgres
x-postgres-host: &postgres_host postgres
x-postgres-port: &postgres_port "5432"
x-postgres-db: &postgres_db ${POSTGRES_DB}
x-postgres-user: &postgres_user ${POSTGRES_USER}
x-postgres-password: &postgres_password ${POSTGRES_PASSWORD}

# the openmetadata release, written only here: the migration job and the server run the same image, and change together.
# 2.0.8 needs elasticsearch 9.x (minimum 9.0.0, tested with 9.3.0)
x-openmetadata-image: &openmetadata_image docker.getcollate.io/openmetadata/server:2.0.8

# what the migration job and the server both need: the server's config (conf/openmetadata.yaml in the image) defaults to
# mysql on localhost and elasticsearch on localhost, so only those are set here, the rest stays the image's default.
# its database is openmetadata (Database/02_create_openmetadata_database.sql), on the same server as the warehouse.
# DB_PARAMS is the value of openmetadata's own compose file. no airflow: ingestion runs as a command, so the server's
# client for it is off
x-openmetadata-env: &openmetadata_env
  TZ: *timezone
  DB_DRIVER_CLASS: org.postgresql.Driver
  DB_SCHEME: postgresql
  DB_PARAMS: allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
  DB_HOST: *postgres_host
  DB_PORT: *postgres_port
  OM_DATABASE: openmetadata
  DB_USER: *postgres_user
  DB_USER_PASSWORD: *postgres_password
  SEARCH_TYPE: elasticsearch
  ELASTICSEARCH_HOST: openmetadata-search
  ELASTICSEARCH_PORT: "9200"
  ELASTICSEARCH_SCHEME: http
  PIPELINE_SERVICE_CLIENT_ENABLED: "false"
  OPENMETADATA_HEAP_OPTS: -Xmx1G -Xms1G

services:
  postgres:
    # the major version is written twice: here and in postgresql-client-<major> in docker/dev/Dockerfile (psql in the
    # dev container). change both together
    image: postgres:18
    # the server's time zone from TZ, so the zone stays written once. compose would replace $TZ itself, $$ leaves it to sh.
    # sh then runs the image's entrypoint with the expanded command, as a plain "command: postgres -c ..." would.
    # datestyle YMD: initdb takes MDY from the en_US locale, which reads 03/11/2026 as 11 March. YMD refuses a date in
    # day or month first order with a four digit year, instead of guessing. ISO dates read the same under any datestyle
    command: ["sh", "-c", "exec docker-entrypoint.sh postgres -c timezone=\"$$TZ\" -c log_timezone=\"$$TZ\" -c datestyle=\"ISO, YMD\""]
    environment:
      TZ: *timezone
      POSTGRES_DB: *postgres_db
      POSTGRES_USER: *postgres_user
      POSTGRES_PASSWORD: *postgres_password
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ../Database/00_create_meltano_database.sql:/docker-entrypoint-initdb.d/00_create_meltano_database.sql:ro
      - ../Database/01_create_schemas_and_tables.sql:/docker-entrypoint-initdb.d/01_create_schemas_and_tables.sql:ro
      - ../Database/02_create_openmetadata_database.sql:/docker-entrypoint-initdb.d/02_create_openmetadata_database.sql:ro
      # prod dumps for the dev refresh: prod writes a pg_dump here, dev restores it (read only, see compose.dev.yaml).
      # in the repo, ignored by git. a convenience for development, not the backups of prod
      - ../Database/dumps:/dumps
    restart: unless-stopped

  # a job: "docker compose run --rm dbt <command>" runs one dbt command, then the container exits
  dbt:
    build:
      context: .. # the repo root, one up from this folder. docker/dbt/Dockerfile.dockerignore keeps only DataWarehouseDbt
      dockerfile: docker/dbt/Dockerfile
      target: runtime # the only stage: dev builds it too, its tools are in the dev image (compose.dev.yaml)
    image: dbt:${RELEASE}
    environment:
      TZ: *timezone # dbt itself always logs in UTC, whatever this says
      DBT_HOST: *postgres_host
      DBT_PORT: *postgres_port
      DBT_DBNAME: *postgres_db
      DBT_USER: *postgres_user
      DBT_ENV_SECRET_PASSWORD: *postgres_password
    depends_on:
      - postgres
    profiles: ["job"] # not started by "up", only by "run"

  # a job: "docker compose run --rm meltano <command>" runs one meltano command, then the container exits
  meltano:
    build:
      context: .. # the repo root, one up from this folder. docker/meltano/Dockerfile.dockerignore keeps only what the image needs
      dockerfile: docker/meltano/Dockerfile
      target: runtime
    image: meltano:${RELEASE}
    environment:
      TZ: *timezone
      # the system database: meltano's own state and run history, in the meltano database of the postgres service
      # (Database/00_create_meltano_database.sql) instead of the default sqlite file.
      # the password is not in the uri, where an @ or / would break it: psycopg reads it from PGPASSWORD
      MELTANO_DATABASE_URI: postgresql+psycopg://${POSTGRES_USER}@postgres:5432/meltano
      PGPASSWORD: *postgres_password
      # the warehouse, where target-postgres loads
      TARGET_POSTGRES_HOST: *postgres_host
      TARGET_POSTGRES_PORT: *postgres_port
      TARGET_POSTGRES_DATABASE: *postgres_db
      TARGET_POSTGRES_USER: *postgres_user
      TARGET_POSTGRES_PASSWORD: *postgres_password
      # the input folder inside the container: tap-csv in DataWarehouseMeltano/meltano.yml reads each file from it
      USER_INPUT_MOUNT: *user_input_mount
    volumes:
      # the input, read only, so meltano can never change an export. the long form, because the short one
      # ("source:target:ro") is a single string, where the anchor cannot go
      - type: bind
        source: ${USER_INPUT_DIR:?set USER_INPUT_DIR in the env file}
        target: *user_input_mount
        read_only: true
    depends_on:
      - postgres
    profiles: ["job"] # not started by "up", only by "run"

  # interactive: "docker compose run --rm datastreamer" takes the drip and drain readings of the OnePen until q.
  # src/bluelab_datastreamer/OnePen.cmd starts it with the bridge (onepen_bridge.py) on windows, at host.docker.internal:8765.
  # no database and no env file: it writes a csv only
  datastreamer:
    build:
      context: .. # the repo root, one up from this folder. docker/datastreamer/Dockerfile.dockerignore keeps only src/bluelab_datastreamer
      dockerfile: docker/datastreamer/Dockerfile
      target: runtime # the only stage: dev builds it too, its tools are in the dev image (compose.dev.yaml)
    image: datastreamer:${RELEASE}
    environment:
      TZ: *timezone # stamps each reading and names the daily csv, read by src/bluelab_datastreamer/drip_drain.py
      # the output folder inside the container: drip_drain.py saves the csv of a part of the day in its subfolder
      USER_OUTPUT_MOUNT: *user_output_mount
      # the work-in-progress folder inside the container: drip_drain.py keeps drip_drain.csv in its subfolder
      WORK_IN_PROGRESS_MOUNT: *work_in_progress_mount
    volumes:
      # the output. the long form, because the short one is a single string, where the anchor cannot go
      - type: bind
        source: ${USER_OUTPUT_DIR:?set USER_OUTPUT_DIR in the env file}
        target: *user_output_mount
      - type: volume
        source: work-in-progress
        target: *work_in_progress_mount
    profiles: ["job"] # not started by "up", only by "run"

  # a server: the NiceGUI pages of the warehouse, at http://localhost on NICEGUI_PORT.
  # started by "up" with postgres, and kept running
  webapps:
    build:
      context: .. # the repo root, one up from this folder. docker/webapps/Dockerfile.dockerignore keeps only src/webapps
      dockerfile: docker/webapps/Dockerfile
      target: runtime # the only stage: dev builds it too, its tools are in the dev image (compose.dev.yaml)
    image: webapps:${RELEASE}
    environment:
      TZ: *timezone
      POSTGRESQL_SERVER: *postgres_host
      POSTGRESQL_PORT: *postgres_port
      POSTGRESQL_DB: *postgres_db
      POSTGRESQL_USER: *postgres_user
      POSTGRESQL_PASSWORD: *postgres_password
    # one port per environment, so dev and prod can run side by side (as postgres does)
    ports:
      - "${NICEGUI_PORT:?set NICEGUI_PORT in the env file}:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  # openmetadata, three services in the openmetadata profile: dev starts them only when asked
  # ("--profile openmetadata up -d"), prod always (COMPOSE_PROFILES in docker/.env.prod).
  # the search engine of openmetadata, its index only: everything in it is rebuilt from the openmetadata database.
  # not published to windows, only the server reads it
  openmetadata-search:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.0
    environment:
      TZ: *timezone
      discovery.type: single-node
      # half of openmetadata's default of 1 GB: plenty for one warehouse, and docker has little memory
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
    volumes:
      - openmetadata-search-data:/usr/share/elasticsearch/data
    healthcheck:
      test: "curl -s http://localhost:9200/_cluster/health?pretty | grep status | grep -qE 'green|yellow' || exit 1"
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    profiles: ["openmetadata"]

  # a job, started by up before the server: creates or migrates the tables of the openmetadata database to the release
  # of the image, then exits. safe to run again, it applies only the migrations not yet applied
  openmetadata-migrate:
    image: *openmetadata_image
    command: ./bootstrap/openmetadata-ops.sh migrate
    environment:
      <<: *openmetadata_env
    depends_on:
      postgres:
        condition: service_started
      openmetadata-search:
        condition: service_healthy
    profiles: ["openmetadata"]

  # a server: the openmetadata ui and api, at http://localhost on OPENMETADATA_PORT. its admin port (8586 inside) is
  # not published
  openmetadata:
    image: *openmetadata_image
    environment:
      <<: *openmetadata_env
    # one port per environment, so dev and prod can run side by side (as postgres does)
    ports:
      - "${OPENMETADATA_PORT:?set OPENMETADATA_PORT in the env file}:8585"
    depends_on:
      postgres:
        condition: service_started
      openmetadata-search:
        condition: service_healthy
      openmetadata-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8586/healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    profiles: ["openmetadata"]

volumes:
  pgdata:
  work-in-progress:
  openmetadata-search-data:
