# dev only, on top of compose.yaml: "docker compose -f docker/compose.yaml -f docker/compose.dev.yaml ...". prod never loads it

# the project name, so "docker compose run" and the Dev Containers use the same postgres container and volume
name: dw-dev

services:
  postgres:
    volumes:
      # replaces the mount of compose.yaml at the same path (/dumps): dev only reads the prod dumps, never changes one
      - ../Database/dumps:/dumps:ro

  dbt:
    build:
      target: dev # runtime plus sqlfmt
    volumes:
      # the whole repo, live: edits apply without a rebuild, and sqlfmt finds pyproject.toml at /usr/app.
      # hides the project copied at build time, at the same path, so the working directory stays /usr/app/DataWarehouseDbt.
      # dbt_packages too: dbt deps installs it into the repo folder (gitignored), and dbt Power User runs dbt deps on open
      - ..:/usr/app

  meltano:
    volumes:
      # the whole repo, live: edits to meltano.yml apply without a rebuild. hides the project copied at build time, at
      # the same path, with its plugins
      - ..:/usr/app
      # dev's own plugins, in a volume instead of the repo folder: their venvs hold linux symlinks that windows and
      # onedrive cannot read, and that break the build context. filled from the image when new, meltano install updates it
      - meltano-plugins:/usr/app/DataWarehouseMeltano/.meltano

  datastreamer:
    build:
      target: dev # runtime plus ruff
    volumes:
      # the whole repo, live: edits apply without a rebuild, ruff finds pyproject.toml at /usr/app, and the csv of
      # the readings is written into the repo folder on windows. hides the code copied at build time, at the same path
      - ..:/usr/app

  webapps:
    build:
      target: dev # runtime plus pytest, pytest-cov and ruff
    # a save on windows sends no change event into the container, so the reload of ui.run checks the files on a timer
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      # the whole repo, live: the app reloads on every save, and ruff finds pyproject.toml at /usr/app.
      # hides the code copied at build time, at the same path
      - ..:/usr/app

volumes:
  meltano-plugins:
