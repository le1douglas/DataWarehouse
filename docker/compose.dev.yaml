# dev only, on top of compose.yaml

# so "docker compose run" and the dev container share the same postgres container and volumes
name: dw-dev

# dev's dbt packages, in the dbt-state volume: the repo mount hides the ones installed in the image
# - filled by dbt deps, run by airflow-init on every up and by dbt Power User on open
x-dbt-packages-env: &dbt_packages_env
  DBT_PACKAGES_INSTALL_PATH: /dbt-state/dev/packages

services:
  postgres:
    volumes:
      # replaces compose.yaml's mount: dev only reads prod's dumps
      - ../Database/dumps:/dumps:ro

  # each service mounts the repo over its runtime image, so an edit applies without a rebuild
  airflow-init:
    volumes:
      - ..:/usr/app
    environment:
      <<: *dbt_packages_env

  # a new or changed model shows only once airflow's manifest is refreshed (docs/INSTALLATION_GUIDE_DOCKER.md)
  airflow-dag-processor:
    volumes:
      - ..:/usr/app
    environment:
      <<: *dbt_packages_env

  airflow-scheduler:
    volumes:
      - ..:/usr/app
      # meltano's plugins, in a volume: their venvs hold linux symlinks that windows and OneDrive cannot read
      # - filled from the image when new, updated by meltano install, shared with the dev container
      - meltano-plugins:/usr/app/DataWarehouseMeltano/.meltano
    environment:
      <<: *dbt_packages_env

  datastreamer:
    volumes:
      - ..:/usr/app

  webapps:
    # a save on windows sends no change event into the container, so the reload polls the files
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ..:/usr/app

  # the dev container: every tool of the three images at the same versions, plus the dev tools and Claude Code
  # - started by .devcontainer/dev, not by up
  dev:
    build:
      context: .. # the repo root. Dockerfile.dockerignore keeps only what the stages need
      dockerfile: docker/pipeline/Dockerfile
      target: dev
    image: dev:dev
    # the services' mounts, so a load, a build or a reading behaves the same here
    volumes:
      - ..:/usr/app
      - dbt-state:/dbt-state
      - meltano-plugins:/usr/app/DataWarehouseMeltano/.meltano
      # the paths of the x-*-mount anchors in compose.yaml
      - type: bind
        source: ${USER_INPUT_DIR:?set USER_INPUT_DIR in the env file}
        target: /user_input
        read_only: true
      - ${USER_OUTPUT_DIR:?set USER_OUTPUT_DIR in the env file}:/user_output
      - work-in-progress:/work_in_progress
      # Claude Code's login, settings and memory: they survive a rebuild, and are lost only with the volume
      # (docs/DEV_CONTAINER.md)
      - claude-config:/claude-config
    # the services' env vars, copied: a yaml anchor cannot reach across files
    environment:
      <<: *dbt_packages_env
      TZ: Europe/Amsterdam # x-timezone in compose.yaml
      # airflow (x-airflow-env)
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Amsterdam
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /usr/app/DataWarehouseAirflow/dags
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}@postgres:5432/airflow
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in the env file}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # dbt
      DBT_HOST: postgres
      DBT_PORT: "5432"
      DBT_DBNAME: ${POSTGRES_DB}
      DBT_USER: ${POSTGRES_USER}
      DBT_ENV_SECRET_PASSWORD: ${POSTGRES_PASSWORD}
      # dbt's folders (x-dbt-env)
      DBT_STATE_DIR: /dbt-state/${RELEASE}
      DBT_TARGET_PATH: /dbt-state/${RELEASE}/interactive/target
      DBT_LOG_PATH: /dbt-state/${RELEASE}/interactive/logs
      DBT_METADATA_EXPORT_DIR: /dbt-state/metadata-export
      # meltano
      MELTANO_DATABASE_URI: postgresql+psycopg://${POSTGRES_USER}@postgres:5432/meltano
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TARGET_POSTGRES_HOST: postgres
      TARGET_POSTGRES_PORT: "5432"
      TARGET_POSTGRES_DATABASE: ${POSTGRES_DB}
      TARGET_POSTGRES_USER: ${POSTGRES_USER}
      TARGET_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      USER_INPUT_MOUNT: /user_input
      # datastreamer
      USER_OUTPUT_MOUNT: /user_output
      WORK_IN_PROGRESS_MOUNT: /work_in_progress
      # webapps
      POSTGRESQL_SERVER: postgres
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: ${POSTGRES_DB}
      POSTGRESQL_USER: ${POSTGRES_USER}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
      WATCHFILES_FORCE_POLLING: "true"
      # psql: a bare "psql" reaches the warehouse. the password is PGPASSWORD above
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      # everything of Claude Code's, its .claude.json too
      CLAUDE_CONFIG_DIR: /claude-config
    depends_on:
      - postgres
    profiles: ["dev"] # not started by up

volumes:
  meltano-plugins:
  claude-config:
